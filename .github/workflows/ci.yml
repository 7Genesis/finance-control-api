name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (build e testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: finance-control-api

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: finance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/finance_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: finance-control-api/package-lock.json

      - run: npm ci

      - name: Build (tsc)
        run: npm run build

      - name: Testes de integração
        run: npm test

  web:
    name: Web (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: finance-control-web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: finance-control-web/package-lock.json

      - run: npm ci

      - name: Build (next build)
        run: npm run build
